# 观复的反向代理示例。
#
# 为什么要有它：观复自己只听 127.0.0.1，TLS 与对外的暴露交给反代。
# 界面交互用 WebSocket，MCP 用 Streamable HTTP。
#
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/guanfu.conf
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $guanfu_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name guanfu.corp.internal;

    ssl_certificate     /etc/ssl/certs/guanfu.crt;
    ssl_certificate_key /etc/ssl/private/guanfu.key;

    # 交付包的 zip 可能不小
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:5177;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP 的事件流需及时转发，Blazor 的交互连接需要保持。
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Blazor WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $guanfu_connection_upgrade;
    }
}
